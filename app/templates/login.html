{% extends "base.html" %}
{% block title %}Login — Supplier ERP{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>Sign in</h1>
  <p class="muted">Internal supplier database — authorized staff only.</p>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username
      <input type="text" name="username" value="{{ username or '' }}" required autocomplete="username" class="input-lg">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password" class="input-lg">
    </label>
    <button type="submit" class="btn btn-primary btn-lg">Login</button>
  </form>
</div>
{% endblock %}
